[project]
name = "web-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yaroslav04", email = "miroshnichenko.jarik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
    "boto3>=1.43.114",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
